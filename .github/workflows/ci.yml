name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ADR-0014, Option B: PHP 8.4 everywhere. One version, declared once.
env:
  PHP_VERSION: '8.4'

permissions:
  contents: read

jobs:
  lint:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: fileinfo, pdo_sqlite, sqlite3, zip, gd, intl, exif, bcmath
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: composer lint:test

  static-analysis:
    name: PHPStan level 6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: fileinfo, pdo_sqlite, sqlite3, zip, gd, intl, exif, bcmath
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: composer stan

  test-sqlite:
    name: Pest on SQLite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: fileinfo, pdo_sqlite, sqlite3, zip, gd, intl, exif, bcmath
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Migrate from zero on SQLite
        run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite

      - run: composer test

  test-mysql:
    name: Pest on MySQL 8 + Redis
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kaiki_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # These override phpunit.xml's SQLite defaults. PHPUnit only applies an
    # <env> entry when the variable is not already set, so the job environment
    # wins — and the `mysql` group asserts the driver really is mysql, so a
    # regression here fails loudly instead of testing SQLite in disguise.
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: kaiki_test
      DB_USERNAME: root
      DB_PASSWORD: root
      # ENV-1: the Redis code paths only ever run here and in production.
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: fileinfo, pdo_mysql, mysqli, redis, zip, gd, intl, exif, bcmath
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate from scratch against MySQL 8
        run: php artisan migrate:fresh --force

      - name: Pest, full suite on MySQL
        run: composer test

      # ENV-11 / TST-8. A group that silently stops executing must fail the
      # build, never pass as green. Three ways this can go wrong, all fatal:
      # the group matches nothing, every test in it skips, or the run reports
      # no summary at all.
      - name: Pest, mysql group (must actually execute)
        run: |
          set -o pipefail
          composer test:mysql 2>&1 | tee pest-mysql.log

          summary="$(sed -e 's/\x1b\[[0-9;]*m//g' pest-mysql.log | grep -oE 'Tests:.*' | head -1)"

          if [ -z "$summary" ]; then
            echo "::error::The 'mysql' group produced no test summary. ENV-11/TST-8: a group that stops executing must fail the build."
            exit 1
          fi

          if echo "$summary" | grep -q 'skipped'; then
            echo "::error::The 'mysql' group SKIPPED ($summary). This job exists to run it for real — the MySQL service or the DB_* environment is not reaching PHPUnit."
            exit 1
          fi

          if ! echo "$summary" | grep -q 'passed'; then
            echo "::error::The 'mysql' group did not report any passing test ($summary)."
            exit 1
          fi

          echo "mysql group executed for real: $summary"

  tenancy-isolation:
    name: Cross-tenant isolation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: fileinfo, pdo_sqlite, sqlite3, zip, gd, intl, exif, bcmath
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # ADR-0001 accepted single-database tenancy on the explicit condition that
      # this suite exists and is a required check. It is the price of the schema,
      # so it runs as its own job rather than buried inside the general suite:
      # a red build here should say "tenant isolation" and nothing else.
      - name: Isolation suite (must actually execute)
        run: |
          set -o pipefail
          composer test:tenancy 2>&1 | tee pest-tenancy.log

          summary="$(sed -e 's/\x1b\[[0-9;]*m//g' pest-tenancy.log | grep -oE 'Tests:.*' | head -1)"

          if [ -z "$summary" ]; then
            echo "::error::The tenancy group produced no test summary. A gate that silently stops running reports green, which is worse than no gate (ENV-11, TST-8)."
            exit 1
          fi

          if echo "$summary" | grep -q 'skipped'; then
            echo "::error::The tenancy group SKIPPED ($summary). The isolation gate must run for real."
            exit 1
          fi

          if ! echo "$summary" | grep -q 'passed'; then
            echo "::error::The tenancy group reported no passing test ($summary)."
            exit 1
          fi

          echo "isolation gate executed for real: $summary"

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    if: always()
    needs: [lint, static-analysis, test-sqlite, test-mysql, tenancy-isolation]
    steps:
      # A single check to make required in branch protection. Without this,
      # adding a job later means remembering to mark it required by hand.
      - name: Fail if any job did not succeed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::A required CI job reported '$r'."
              exit 1
            fi
          done
          echo "All required jobs succeeded."
