name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ADR-0014, Option B: PHP 8.4 everywhere. One version, declared once.
env:
  PHP_VERSION: '8.4'

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Nine jobs, and it used to be sixteen (#90).
#
# On a private repository every job is billed separately and rounded up to the
# minute, and each one pays for a runner start, a checkout, a PHP install and a
# `composer install` before it does anything at all. That fixed overhead is
# roughly a minute and a half per job — so sixteen jobs spent about twenty-four
# minutes of overhead to do perhaps six minutes of work, and the account's
# monthly allowance went in a day.
#
# **The cost was the number of jobs, not the work.** So:
#
#   - the four fast static checks share one job; they ran on identical setups
#     and finished in seconds each;
#   - the suite runs **once**, with coverage. It used to run twice — once plain
#     and once instrumented — which was the largest duplicate in the file;
#   - the two "prove it actually executed" gates share a job with the timezone
#     run, all three being small SQLite suites;
#   - the four Node checks share a job, because all four are stubs printing one
#     line until M3 and M4. **They split back out the moment they stop being
#     stubs** — WGT-2's size budget is a named required check and deserves its
#     own red square once there is a bundle to measure.
#
# Nothing was dropped. Every command that ran before still runs, and a merged
# job still names the step that failed, which is what somebody reading a red
# build actually needs.
# ---------------------------------------------------------------------------

jobs:
  static-checks:
    name: Pint, PHPStan, i18n and the API contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: fileinfo, pdo_sqlite, sqlite3, zip, gd, intl, exif, bcmath
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Pint
        run: composer lint:test

      - name: PHPStan level 6
        run: composer stan

      # I18N-2 and I18N-3. Formerly its own job, on the argument that "the Greek
      # translations are missing" and "a test failed" are different problems for
      # whoever reads the red build. That argument is about **legibility**, and a
      # named step keeps it: GitHub reports which step failed, and this one is
      # called what it checks.
      - name: EL/EN parity and hardcoded-string lint
        run: composer i18n:check

      # Scramble infers response shapes by walking the controller, and that walk
      # reaches Eloquent models — which need their table to resolve attributes
      # and casts. Hence the migrate; without it the generator dies with a
      # `QueryException` that reads like a Scramble bug, which is how #35 found
      # this.
      - name: Migrate from zero on SQLite
        run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite

      # ENV-28. `docs/api.md` is the contract and Scramble generates the
      # implementation's view of it; this reconciles the two. The comparison is
      # directional until the last endpoint lands — every route must be
      # documented, while a documented path with no route yet is "not built"
      # rather than drift.
      - name: Regenerate the OpenAPI document
        run: composer api:docs

      - name: Reconcile the routes against docs/api.md §5
        run: composer test:api-docs

      # The generated document is an artefact, never committed. Uploading it on
      # every run — red or green — is what makes a red build actionable without
      # a local PHP install, the same way the schema snapshot job works.
      - name: Upload the generated document
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-generated
          path: build/openapi.generated.json
          if-no-files-found: warn

  test-suite:
    name: Pest on SQLite, with the coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ENV-22: coverage needs a driver, and the local stack has none. PCOV
      # rather than Xdebug — an order of magnitude faster, and this runs on
      # every pull request.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: fileinfo, pdo_sqlite, sqlite3, zip, gd, intl, exif, bcmath
          coverage: pcov

      - uses: ramsey/composer-install@v3

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Migrate from zero on SQLite
        run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite

      # **One run, not two.** This was two jobs: `test-sqlite` ran the suite
      # plain and `coverage` ran the identical suite again under PCOV.
      # `test:coverage` excludes exactly the same three groups as `test`, so the
      # second run only ever confirmed what the first had already proved — at
      # the price of running two thousand tests twice, on every push.
      #
      # TST-1's 80% threshold lives in composer.json and is deliberately not
      # repeated here, so raising it stays a one-line change.
      - name: Pest with coverage restricted to app/Domain
        run: composer test:coverage

      # Every other gate in this file proves it actually ran; this one could
      # not. php-code-coverage returns 100% for a source set with zero
      # executable lines, so if the app/Domain filter in phpunit.coverage.xml
      # ever stopped matching — a rename, a moved namespace, a typo — the gate
      # would pass at 100% against nothing at all and say so proudly.
      - name: The coverage gate must have measured something
        run: |
          php -r '
            $report = simplexml_load_file("coverage.xml");
            $statements = (int) ($report->project->metrics["statements"] ?? 0);

            if ($statements < 1) {
                fwrite(STDERR, "::error::Coverage measured 0 executable lines. An empty source set reports 100%, so this gate was green while measuring nothing — check the app/Domain filter in phpunit.coverage.xml.\n");
                exit(1);
            }

            printf("coverage measured %d executable statements in app/Domain%s", $statements, PHP_EOL);
          '

  test-mysql:
    name: Pest on MySQL 8 + Redis
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kaiki_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    # These override phpunit.xml's SQLite defaults. PHPUnit only applies an
    # <env> entry when the variable is not already set, so the job environment
    # wins — and the `mysql` group asserts the driver really is mysql, so a
    # regression here fails loudly instead of testing SQLite in disguise.
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: kaiki_test
      DB_USERNAME: root
      DB_PASSWORD: root
      # ENV-1: the Redis code paths only ever run here and in production.
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: fileinfo, pdo_mysql, mysqli, redis, zip, gd, intl, exif, bcmath
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate from scratch against MySQL 8
        run: php artisan migrate:fresh --force

      - name: Pest, full suite on MySQL
        run: composer test

      # ENV-11 / TST-8. A group that silently stops executing must fail the
      # build, never pass as green. Three ways this can go wrong, all fatal:
      # the group matches nothing, every test in it skips, or the run reports
      # no summary at all.
      - name: Pest, mysql group (must actually execute)
        run: |
          set -o pipefail
          composer test:mysql 2>&1 | tee pest-mysql.log

          summary="$(sed -e 's/\x1b\[[0-9;]*m//g' pest-mysql.log | grep -oE 'Tests:.*' | head -1)"

          if [ -z "$summary" ]; then
            echo "::error::The 'mysql' group produced no test summary. ENV-11/TST-8: a group that stops executing must fail the build."
            exit 1
          fi

          if echo "$summary" | grep -q 'skipped'; then
            echo "::error::The 'mysql' group SKIPPED ($summary). This job exists to run it for real — the MySQL service or the DB_* environment is not reaching PHPUnit."
            exit 1
          fi

          if ! echo "$summary" | grep -q 'passed'; then
            echo "::error::The 'mysql' group did not report any passing test ($summary)."
            exit 1
          fi

          echo "mysql group executed for real: $summary"

  runtime-gates:
    name: Tenant isolation and the timezone run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: fileinfo, pdo_sqlite, sqlite3, zip, gd, intl, exif, bcmath
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Migrate from zero on SQLite
        run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite

      # ADR-0001 accepted single-database tenancy on the explicit condition that
      # this suite exists and is a required check. It is the price of the schema
      # — which is why it keeps its own named step: a red build here should say
      # "tenant isolation" and nothing else.
      - name: Isolation suite (must actually execute)
        run: |
          set -o pipefail
          composer test:tenancy 2>&1 | tee pest-tenancy.log

          summary="$(sed -e 's/\x1b\[[0-9;]*m//g' pest-tenancy.log | grep -oE 'Tests:.*' | head -1)"

          if [ -z "$summary" ]; then
            echo "::error::The tenancy group produced no test summary. A gate that silently stops running reports green, which is worse than no gate (ENV-11, TST-8)."
            exit 1
          fi

          if echo "$summary" | grep -q 'skipped'; then
            echo "::error::The tenancy group SKIPPED ($summary). The isolation gate must run for real."
            exit 1
          fi

          if ! echo "$summary" | grep -q 'passed'; then
            echo "::error::The tenancy group reported no passing test ($summary)."
            exit 1
          fi

          echo "isolation gate executed for real: $summary"

      # ENV-14. The availability engine converts between a tenant timezone and
      # UTC constantly, and the machine's own zone must never enter the answer.
      # Running under a *third* zone is what makes that testable: UTC would hide
      # an unconverted value and Europe/Athens would hide an unconverted tenant.
      # America/Los_Angeles is neither, is on the other side of the date line
      # from Athens for part of the day, and has its own transitions on
      # different dates.
      - name: Pest, availability group under America/Los_Angeles
        run: php vendor/bin/pest --group=fast --filter='Availability'
        env:
          TZ: America/Los_Angeles
          APP_TIMEZONE: America/Los_Angeles

  pdf-chromium:
    name: PDF rendering (Browsershot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: fileinfo, pdo_sqlite, sqlite3, zip, gd, intl, exif, bcmath
          coverage: none

      - uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Browsershot drives Chromium through Puppeteer's Node bridge, so both
      # halves have to be here: the library, and a browser for it to talk to.
      # The runner already ships a Chrome, so Puppeteer's own 150 MB download is
      # skipped and `PUPPETEER_EXECUTABLE_PATH` points at that one.
      - name: Install Puppeteer without its bundled Chromium
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Migrate from zero on SQLite
        run: php artisan migrate --force
        env:
          DB_CONNECTION: sqlite

      # ENV-20: *"CI always runs them."* The group is excluded from
      # `composer test` because a developer without a browser must not get a
      # false green — which makes this job the only place the PDFs are ever
      # actually rendered. If it stops running, nothing else notices.
      - name: Pest, chromium group
        run: php vendor/bin/pest --group=chromium
        env:
          DB_CONNECTION: sqlite
          KAIKI_CHROME_PATH: /usr/bin/google-chrome
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome

  # ENV-23 names the widget build and its size budget as checks of their own,
  # and #106 gave them something to measure — so they left `node-checks` and
  # took their own red square, which is the split the old comment promised.
  #
  # WGT-2's 80 KB budget deserves that square more than anything else here: it
  # is the constraint that shapes every decision inside the widget, and a budget
  # buried in a job with three stubs is a budget somebody raises rather than
  # enforces.
  widget-build:
    name: Widget build, size budget and guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build (WGT-1)
        run: npm run widget:build

      # WGT-2, and it **fails** over 80 KB gzipped rather than warning.
      - name: Size budget (WGT-2, NFR-3)
        run: npm run widget:size

      # The three rules about what is absent: no hardcoded brand colour (WGT-9),
      # no price arithmetic (WGT-13), and both locale bundles carrying the same
      # keys (WGT-14, whose "fails the build in CI" is this line).
      - name: Bundle guards (WGT-9, WGT-13, WGT-14)
        run: npm run widget:guards

      - name: Vitest
        run: npm run widget:test

  # **Split back out of `node-checks` by issue 111**, which is what the old
  # comment there promised would happen once it stopped being a stub. It takes
  # real time now — a browser, a server, a seeded database — and it deserves its
  # own red square, because "the booking flow is broken" and "the plugin linter
  # is unhappy" are not the same news.
  #
  # The **smoke** subset only: all four mounts against the built artefact. The
  # full suite — the keyboard walk, the axe scan, the hostile-CSS and strict-CSP
  # fixtures, and the seventy-second hold expiry — runs nightly, because a
  # seventy-second wait in front of every pull request is a wait somebody
  # eventually deletes.
  widget-e2e:
    name: Widget end-to-end smoke (TST-3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: fileinfo, pdo_sqlite, sqlite3, zip, gd, intl, exif, bcmath
          coverage: none

      - uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: cp .env.example .env && php artisan key:generate

      # The bundle the browser will actually load. Built and published here
      # rather than downloaded, because this job is about the code on this
      # branch — the release workflow is where a published artefact is gated.
      - name: Build and publish the widget
        run: npm run widget:build && php artisan widget:publish

      - name: Install Chromium
        run: npm run e2e:install

      - name: Playwright smoke on all four mounts
        run: npm run e2e:smoke

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-smoke
          path: packages/widget/e2e/.results
          retention-days: 7

  # **The last of #90's four merged Node stubs to split out**, and the one that
  # never belonged in a Node job at all: it is phpcs, over PHP, against the
  # WordPress coding standard. It sat there because it printed a sentence.
  #
  # It runs on **PHP 8.1**, not the 8.4 everything else uses. That is the whole
  # point of the job: the plugin runs on operator hosting (WPP-1, ARC-9), a
  # developer writing it has 8.4 habits, and the compatibility ruleset here is
  # what catches an enum in a property type before an operator's site fatals on
  # it.
  plugin-lint:
    name: WordPress plugin standard (WPP-11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Install the plugin's own dependencies
        run: composer install --no-interaction --no-progress
        working-directory: packages/wordpress-plugin/kaiki-booking

      - name: phpcs, WordPress ruleset and PHP 8.1 compatibility
        run: npm run plugin:lint

  security-audit:
    name: Dependency audit
    # SEC-12. Shared with nightly.yml so the severity threshold cannot end up
    # meaning two different things in two files.
    uses: ./.github/workflows/dependency-audit.yml

  migrate-from-zero:
    name: Migrate from zero and compare the schema
    # ENV-10. Shared with nightly.yml for the same reason.
    uses: ./.github/workflows/schema-drift.yml

  ci-passed:
    name: CI passed
    runs-on: ubuntu-latest
    if: always()
    needs: [static-checks, test-suite, test-mysql, runtime-gates, pdf-chromium, widget-build, widget-e2e, plugin-lint, security-audit, migrate-from-zero]
    steps:
      # A single check to make required in branch protection. Without this,
      # adding a job later means remembering to mark it required by hand.
      - name: Fail if any job did not succeed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for r in $results; do
            if [ "$r" != "success" ]; then
              echo "::error::A required CI job reported '$r'."
              exit 1
            fi
          done
          echo "All required jobs succeeded."
