name: Nightly

# ENV-25. Nightly exists for the checks that are either too slow to sit on a
# pull request or that can fail without anybody pushing anything — a security
# advisory published at 3am is nobody's commit, and it should still turn a
# build red before the working day starts.
on:
  schedule:
    # 02:00 UTC — 04:00 or 05:00 in Europe/Athens depending on the season, and
    # in either case before anyone is looking.
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Dependency audit
    # SEC-12. The same workflow the pull-request run calls, so an advisory can
    # never be blocking on one path and advisory-only on the other.
    uses: ./.github/workflows/dependency-audit.yml

  migrate-from-zero:
    name: Migrate from zero and compare the schema
    # ENV-10. Also on every pull request; nightly catches the case where a
    # migration merged from a branch that had not been rebased.
    uses: ./.github/workflows/schema-drift.yml

  # The full end-to-end suite (TST-3, A11Y-1), which the pull-request run sees
  # only a smoke subset of. Here because of what it contains: a seventy-second
  # hold expiry watched on a real clock, an axe pass over every mount, a
  # keyboard-only booking, and two hostile host pages. None of it belongs in
  # front of every push, and all of it belongs in front of every morning.
  playwright:
    name: The full end-to-end run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo, pdo_sqlite, sqlite3, zip, gd, intl, exif, bcmath
          coverage: none

      - uses: ramsey/composer-install@v3

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: cp .env.example .env && php artisan key:generate

      - name: Build and publish the widget
        run: npm run widget:build && php artisan widget:publish

      - name: Install Chromium
        run: npm run e2e:install

      - name: The whole suite
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-nightly
          path: packages/widget/e2e/.results
          retention-days: 14

  # ---------------------------------------------------------------------------
  # ENV-25 lists four things. One of them does not exist yet, and is recorded
  # here rather than omitted, because "the nightly does not run the benchmark"
  # is a fact somebody should be able to discover from this file.
  #
  # The WordPress site run (`npm run e2e:wp`) joins `playwright` above in M4,
  # when there is a plugin to run it against.
  #
  # availability-performance:
  #   The NFR-1 benchmark: the availability endpoint under 150 ms at p95, on
  #   MySQL 8 against the seeded dataset NFR-1 defines. Note this runs first at
  #   the CLOSE OF M2, not at M8 — AVL-12b pulled it forward, because missing
  #   the threshold is the documented trigger to reopen ADR-0023, and that is
  #   only affordable while the shape is still cheap to change.
  # ---------------------------------------------------------------------------
